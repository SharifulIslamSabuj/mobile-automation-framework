# Common Configuration
#
# Applies to every environment. Values here are overridden by the active
# environment-specific file (config-<env>.properties) when the same key is
# present in both, and by a matching JVM system property at the highest
# precedence. See docs/framework/CONFIGURATION_ARCHITECTURE.md.

# --- Appium server connection (added Phase 4 — see docs/framework/DRIVER_ARCHITECTURE.md) ---
appium.serverUrl=http://127.0.0.1:4723

# --- Application (AUT is frozen per MA-PV-001 — Sauce Labs My Demo App Android) ---
app.package=com.saucelabs.mydemoapp.android
app.activity=com.saucelabs.mydemoapp.android.view.activities.SplashActivity
# app.path must point to the .apk under test. Left blank in source control —
# supply via -Dapp.path=<absolute-path-to-apk> for a local .apk, or override
# this key in a future cloud/CI-specific profile.
app.path=

# --- Device / platform (frozen stack — MA-PV-001 SS16: Android + UiAutomator2 only) ---
platform.name=Android
automation.name=UiAutomator2

# --- Driver timeouts ---
driver.newCommandTimeoutSeconds=120
# Per MA-FR-001 SS5 (explicit waits only) this is intentionally 0 — do not raise
# this to compensate for a missing explicit wait; add the explicit wait instead.
driver.implicitWaitSeconds=0
driver.explicitWaitTimeoutSeconds=15
driver.pageLoadTimeoutSeconds=30

# --- Execution flags ---
execution.noReset=true
execution.fullReset=false
execution.autoGrantPermissions=true
execution.retryCount=1

# --- Reporting ---
report.directory=reports
report.screenshotDirectory=reports/screenshots

# --- Logging ---
log.level=INFO
# Added Phase 6 — see docs/framework/CROSS_CUTTING_INFRASTRUCTURE.md
logging.directory=logs
