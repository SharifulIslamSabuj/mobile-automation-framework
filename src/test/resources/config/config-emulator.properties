# Emulator Environment Overrides
#
# Active when -Denv=emulator (the default if -Denv is not supplied at all).
# Only keys that genuinely differ from config.properties belong here.

execution.mode=EMULATOR

# "emulator-5554" is the ADB serial Android assigns to the first running AVD
# instance by convention — a reasonable local default, not a specific device
# claim. Replace with your actual emulator's serial (`adb devices`) if different.
device.name=emulator-5554

# Left blank intentionally: the concrete Android version depends on which
# system image the local AVD was created with. Set explicitly before use,
# e.g. platform.version=14
platform.version=

# Emulators are not addressed by UDID in the same sense as physical hardware;
# left blank so UiAutomator2 falls back to device.name-based session targeting.
device.udid=
