# Real-Device Environment Overrides
#
# Active when -Denv=real-device. Only keys that genuinely differ from
# config.properties belong here.
#
# All three values below are intentionally blank: a physical device's name,
# OS version, and UDID are specific to whichever unit is plugged in for a
# given run and must never be hardcoded/assumed in source control. Supply
# them via system property at execution time, e.g.:
#   -Denv=real-device -Ddevice.name="Pixel 7" -Dplatform.version=14 -Ddevice.udid=<adb-serial>
# ConfigReader#getRequiredString-style strict validation is intentionally
# NOT applied to these three keys (see ConfigReader#getDeviceName/getPlatformVersion/getUdid) —
# they resolve to an empty string, not an exception, if left unset here; the
# Driver layer (a later phase) is responsible for deciding whether an empty
# value is acceptable for a given real-device run.

execution.mode=REAL_DEVICE
device.name=
platform.version=
device.udid=
