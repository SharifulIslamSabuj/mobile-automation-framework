plugins {
    id 'java'
    // Allure reporting (Reporting Enhancement phase). Official Gradle plugin,
    // verified current at implementation time: requires Gradle 8.11+/Java 17+
    // (both satisfied — Gradle 9.0.0, Java 17), auto-detects TestNG on the
    // classpath and wires the adapter/report tasks (`allureReport`,
    // `allureServe`) without a manually-maintained task definition.
    id 'io.qameta.allure' version '4.1.0'
}

// Root-cause investigation (docs/allure/PHASE_C_ALLURE_SERVE_ZERO_RESULTS_ROOT_CAUSE_AND_FIX_REPORT.md)
// proved that the default multi-file "Awesome" report output serves a browser
// a page whose own embedded `window.allureReportOptions.id` expects its real
// data under an `awesome/` subpath the plugin's bundled dev server does not
// correctly route — the report always renders "0 results" in an actual
// browser regardless of whether the underlying data is correct (confirmed via
// direct HTTP fetch of the live-served summary.json vs. the on-disk file).
// `singleFile` is the plugin's own documented option (allure-framework/allure-gradle
// README, `allure { report { singleFile = true } }`) for producing one
// self-contained HTML file with all data embedded inline — this removes the
// separate-fetch/base-path mechanism the defect depends on entirely, rather
// than working around a specific symptom of it.
allure {
    report {
        singleFile = true
    }
}

group = 'com.mobileautomation.framework'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

// UTF-8 everywhere: source encoding, compiled bytecode resource reading, and test execution.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}
tasks.withType(Test).configureEach {
    systemProperty 'file.encoding', 'UTF-8'
}

dependencies {
    // Automation Engine / Driver support (MA-PV-001 §16; MA-FA-001 §9 Driver Management)
    // NOTE: "Appium Java Client 3.x" as originally specified does not correspond to a current
    // artifact version (the 3.x client line predates the W3C protocol and is incompatible with
    // Appium 2.x/3.x servers). 9.x is the current client line compatible with Appium 3.x + UiAutomator2.
    implementation 'io.appium:java-client:9.4.0'
    implementation 'org.seleniumhq.selenium:selenium-java:4.25.0'

    // Logging Layer (MA-FA-001 §16, tool choice recorded in MA-FA-001 v1.1)
    implementation 'org.slf4j:slf4j-api:2.0.16'
    implementation 'org.apache.logging.log4j:log4j-core:2.24.1'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.24.1'

    // Reporting Layer (MA-FA-001 §15, tool choice recorded in MA-FA-001 v1.1)
    implementation 'com.aventstack:extentreports:5.1.1'

    // Test Data Layer serialization (MA-FA-001 §11, tool choice recorded in MA-FA-001 v1.1)
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.0'
    // YAML/Properties test-data formats (Phase 8) — pinned to the exact jackson-databind version
    // above to avoid classpath binding mismatches (same rationale as log4j-core/log4j-slf4j2-impl).
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.18.0'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-properties:2.18.0'

    // Synthetic test-data generation (Phase 8). "net.datafaker" is the actively maintained
    // successor to the now-dormant "com.github.javafaker" (last released 2020, carries an
    // outdated/vulnerable transitive SnakeYAML) — selected instead per MA-DEP-001's
    // no-unmaintained-dependency principle.
    implementation 'net.datafaker:datafaker:2.4.3'

    // Boilerplate reduction (docs/architecture/DEPENDENCY_VERSION_FREEZE.md) — used for POJOs/models
    // and, later, Page Object field boilerplate. compileOnly + annotationProcessor on both source
    // sets since Lombok is a compile-time-only annotation processor, never a runtime dependency.
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'

    // General-purpose utilities (docs/architecture/DEPENDENCY_VERSION_FREEZE.md)
    implementation 'org.apache.commons:commons-lang3:3.17.0'

    // Test Framework (MA-PV-001 §16). Deliberately "implementation", not
    // "testImplementation": the frozen `listeners` package lives under
    // src/main/java (Project Bootstrap) and hosts TestNG-coupled
    // infrastructure (RetryAnalyzer, Suite/Test/Method listeners) added in
    // Phase 6 — those classes cannot compile against a test-scoped-only
    // dependency. This is also the architecturally correct scope for a test
    // *automation framework* project (as opposed to a typical application):
    // any consumer of this framework needs TestNG on their classpath
    // regardless. See docs/framework/CROSS_CUTTING_INFRASTRUCTURE.md.
    implementation 'org.testng:testng:7.10.2'

    // Allure reporting (Reporting Enhancement phase) — additive alongside
    // ExtentReports (MA-FA-001 §15), not a replacement. The Gradle plugin's
    // own TestNG auto-detection wires result-writing into the `test` task;
    // this explicit dependency is still required (verified against the
    // current official Allure TestNG/Gradle documentation) for `@Epic`,
    // `@Feature`, `@Story`, `@Severity`, and `@Step` to be available at
    // compile time. Declared via the official BOM so the annotation
    // artifact's version always matches the adapter version the Gradle
    // plugin resolves (2.35.2 at the time of this integration).
    testImplementation platform('io.qameta.allure:allure-bom:2.35.3')
    testImplementation 'io.qameta.allure:allure-testng'
}

test {
    useTestNG()
    // Retained from the Pilot-First Enterprise Development Strategy's foundation-only phases
    // (Phases 4-8, governance rule), when src/test/java held only reusable infrastructure
    // (assertions.CommonAssertions) and zero @Test methods — Gradle 9's default
    // failOnNoDiscoveredTests=true would have treated that as a build failure rather than a
    // no-op, breaking the documented `gradlew clean build` command (see MA-EFR-001 §28,
    // docs/framework/FOUNDATION_READINESS_RESOLUTION.md). Since Phase 9, real Test Classes exist
    // and are discovered normally (19 automated test cases as of Framework Version 1.0.0), so
    // this flag has no effect on current runs; left in place as a harmless guard against the
    // same build failure if the suite is ever pared back to zero tests again.
    failOnNoDiscoveredTests = false

    // Gradle's Test task runs in a forked JVM that does not automatically inherit the build
    // JVM's system properties — a `-Dapp.path=...`/`-Dplatform.version=...`/`-Ddevice.name=...`
    // passed to `gradlew test` would otherwise never reach ConfigReader at runtime. Required for
    // MA-CICD-002's system-property override strategy (CI and real-device execution alike) to
    // actually work. Re-asserted after the forward so it always wins regardless of the host
    // JVM's own file.encoding value.
    systemProperties(System.properties)
    systemProperty 'file.encoding', 'UTF-8'
}

task printTestRuntimeClasspath {
    doLast {
        println sourceSets.test.runtimeClasspath.asPath
    }
}

// Standalone Allure CLI local reporting (Phase C-Correction —
// docs/allure/PHASE_C_CORRECTION_STANDALONE_CLI_IMPLEMENTATION_REPORT.md).
// Replaces `allureServe` for LOCAL use: that task was proven to serve a
// generic "0 results" stub regardless of correct underlying data
// (docs/allure/PHASE_C_ALLURE_SERVE_ZERO_RESULTS_ROOT_CAUSE_AND_FIX_REPORT.md).
// The `io.qameta.allure` plugin and its `allureReport` task are deliberately
// NOT removed and NOT reconfigured here — the (uncommitted) CI workflow's
// `aggregate` job still calls `./gradlew allureReport` and uploads its
// output as an artifact, and touching that is out of scope for this phase
// (GitHub Actions is explicitly not to be modified here). This task uses the
// separately-installed standalone Allure CLI (`allure --version`, confirmed
// present) instead, which does not share the "Awesome" plugin's serving
// defect.
//
// Deliberately generates only — does NOT also run `allure open`, since that
// starts a long-lived local web server that would block this task (and the
// Gradle daemon) indefinitely until manually killed. Run `allure open
// build/allure-report` yourself afterward. Also deliberately does NOT run
// tests first — kept composable so the report can be regenerated without
// re-running the (slow, real-device) suite.
tasks.register('allureLocalReport', Exec) {
    group = 'reporting'
    description = 'Generates a fresh Allure report from build/allure-results using the standalone Allure CLI (does not run tests, does not open a browser - run "allure open build/allure-report" afterward).'
    doFirst {
        def resultsDir = file('build/allure-results')
        if (!resultsDir.isDirectory() || resultsDir.list().length == 0) {
            throw new GradleException("build/allure-results is empty or missing — run './gradlew test' first.")
        }
    }
    commandLine 'cmd', '/c', 'allure', 'generate', 'build/allure-results', '--clean', '-o', 'build/allure-report'
}
