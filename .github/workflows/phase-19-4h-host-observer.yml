name: Phase 19.4H — Independent Host-Side ADB Observer Forensic Run (Temporary)

# FORENSIC ONLY — not a production workflow, not a fix-validation workflow.
# Identical Docker Model 3 architecture/gates as Phase 19.4E/F/G (image
# build, Gates 1-6 connectivity, Gate 7-8 representative test). Phase 19.4G
# found that diagnostic instrumentation sharing the test's own Appium
# session causes severe command-level contention (~3.6x test-duration
# inflation) and unreliable shell-command results. This workflow instead
# observes the emulator entirely from the GitHub Actions HOST side, via
# direct `adb` calls run in parallel with (but never through) the
# Dockerized test's Appium session — no AndroidDriverFactory.java changes
# at all this phase. Manual-trigger-only; triggered as up to 5 SEPARATE,
# SEQUENTIAL runs, stopping immediately once a failure with complete
# observer evidence is captured or after 5 runs complete without
# reproducing the failure. Does not touch mobile-automation.yml, Dockerfile,
# or .dockerignore. Deleted after the investigation.
on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  APPIUM_SERVER_VERSION: "3.6.0"
  APPIUM_UIAUTOMATOR2_DRIVER_VERSION: "8.2.2"
  AUT_RELEASE_TAG: "2.2.0"
  AUT_APK_ASSET: "mda-2.2.0-25.apk"
  AUT_DOWNLOAD_URL: "https://github.com/saucelabs/my-demo-app-android/releases/download/2.2.0/mda-2.2.0-25.apk"
  AUT_PACKAGE: "com.saucelabs.mydemoapp.android"
  ANDROID_API_LEVEL: "34"
  ANDROID_PLATFORM_VERSION: "14"
  ANDROID_TARGET: "google_apis"
  ANDROID_ARCH: "x86_64"
  ANDROID_DEVICE_PROFILE: "pixel"
  EMULATOR_DEVICE_NAME: "emulator-5554"

jobs:
  host-observer-run:
    name: Independent Host-Side ADB Observer Run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Appium Server
        run: npm install --global "appium@${{ env.APPIUM_SERVER_VERSION }}"

      - name: Install UiAutomator2 Driver
        run: appium driver install "uiautomator2@${{ env.APPIUM_UIAUTOMATOR2_DRIVER_VERSION }}"

      - name: Restore Cached AUT APK
        id: apk-cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/${{ env.AUT_APK_ASSET }}
          key: aut-apk-${{ env.AUT_RELEASE_TAG }}

      - name: Download AUT APK
        if: steps.apk-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL -o "${{ runner.temp }}/${{ env.AUT_APK_ASSET }}" "${{ env.AUT_DOWNLOAD_URL }}"

      - name: Export APK Path
        run: echo "APK_PATH=${{ runner.temp }}/${{ env.AUT_APK_ASSET }}" >> "$GITHUB_ENV"

      - name: Build Docker Harness Image (unmodified Phase 19.3 Dockerfile)
        run: docker build -t mobile-automation-harness:phase19.4h .

      - name: Write host-observer script
        run: |
          cat > "${{ github.workspace }}/host-observer.sh" <<'HOST_OBSERVER_EOF'
          #!/usr/bin/env bash
          set -u

          section () { echo ""; echo "===== $1 ====="; }
          AUT_PACKAGE="${AUT_PACKAGE:-com.saucelabs.mydemoapp.android}"

          section "GATE 1-2: RUNNER + EMULATOR"
          adb devices -l
          echo "GATE1_GATE2_STATUS=PASS"

          section "GATE 3: HOST APPIUM"
          appium server --log-level info --relaxed-security > "${RUNNER_TEMP}/appium-server.log" 2>&1 &
          APPIUM_PID=$!
          READY=0
          for i in $(seq 1 30); do if curl -sf http://127.0.0.1:4723/status > /dev/null; then READY=1; break; fi; sleep 2; done
          if [ "$READY" != "1" ]; then echo "GATE3_STATUS=FAIL"; exit 1; fi
          echo "GATE3_STATUS=PASS"

          section "GATE 6: CONTAINER -> HOST APPIUM"
          docker run --rm --network=host mobile-automation-harness:phase19.4h bash -c 'timeout 5 bash -c "cat < /dev/null > /dev/tcp/127.0.0.1/4723" && echo "GATE6_STATUS=PASS" || echo "GATE6_STATUS=FAIL"'

          section "START INDEPENDENT HOST-SIDE OBSERVER (adb-direct, no Appium session involved)"
          adb logcat -c
          adb logcat -v time > "${GITHUB_WORKSPACE}/observer-logcat-raw.log" 2>&1 &
          LOGCAT_PID=$!
          echo "OBSERVER_LOGCAT_PID=${LOGCAT_PID}"
          echo "OBSERVER_START_TS=$(date -u +"%Y-%m-%d %H:%M:%S.%3N")"

          cat > "${RUNNER_TEMP}/observer-poll.sh" <<'POLL_EOF'
          #!/usr/bin/env bash
          APP_PACKAGE="$1"
          OUT="$2"
          while true; do
            TS=$(date -u +"%Y-%m-%d %H:%M:%S.%3N")
            WINDOW_DUMP=$(adb shell dumpsys window 2>/dev/null)
            CURRENT_FOCUS=$(echo "$WINDOW_DUMP" | grep -m1 "mCurrentFocus")
            FOCUSED_APP=$(echo "$WINDOW_DUMP" | grep -m1 "mFocusedApp")
            ACTIVITY_DUMP=$(adb shell dumpsys activity activities 2>/dev/null)
            RESUMED_ACTIVITY=$(echo "$ACTIVITY_DUMP" | grep -m1 "mResumedActivity")
            TOP_RESUMED=$(echo "$ACTIVITY_DUMP" | grep -m1 "topResumedActivity")
            PID=$(adb shell pidof "$APP_PACKAGE" 2>/dev/null | tr -d '\r\n')
            if [ -n "$PID" ]; then PROC_STATE="RUNNING pid=$PID"; else PROC_STATE="NOT_RUNNING"; fi
            echo "[HOST-OBSERVER] ts=${TS} mCurrentFocus=${CURRENT_FOCUS:-NOT_AVAILABLE} mFocusedApp=${FOCUSED_APP:-NOT_AVAILABLE} mResumedActivity=${RESUMED_ACTIVITY:-NOT_AVAILABLE} topResumedActivity=${TOP_RESUMED:-NOT_AVAILABLE} processState=${PROC_STATE}" >> "$OUT"
            sleep 1
          done
          POLL_EOF
          chmod +x "${RUNNER_TEMP}/observer-poll.sh"
          "${RUNNER_TEMP}/observer-poll.sh" "$AUT_PACKAGE" "${GITHUB_WORKSPACE}/observer-state.log" &
          POLL_PID=$!
          echo "OBSERVER_POLL_PID=${POLL_PID}"

          section "GATE 7-8: CONTAINER-CREATED APPIUM SESSION VIA ONE REPRESENTATIVE TEST (host-observed, session-independent)"
          mkdir -p "${RUNNER_TEMP}/docker-gradle-home"
          docker run --rm --network=host \
            --user "$(id -u):$(id -g)" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${RUNNER_TEMP}/docker-gradle-home:/tmp/gradle-home" \
            -e "GRADLE_USER_HOME=/tmp/gradle-home" \
            -w /workspace \
            mobile-automation-harness:phase19.4h \
            ./gradlew test --tests "com.mobileautomation.framework.tests.LoginTest" --no-daemon \
              -Denv=emulator \
              -Dappium.serverUrl=http://127.0.0.1:4723 \
              -Dplatform.version="${ANDROID_PLATFORM_VERSION}" \
              -Ddevice.name="${EMULATOR_DEVICE_NAME}" \
              -Dapp.path="${APK_PATH}"
          REPRESENTATIVE_EXIT=$?
          echo "REPRESENTATIVE_TEST_EXIT=$REPRESENTATIVE_EXIT"

          section "STOP INDEPENDENT HOST-SIDE OBSERVER"
          echo "OBSERVER_STOP_TS=$(date -u +"%Y-%m-%d %H:%M:%S.%3N")"
          kill "$POLL_PID" 2>/dev/null || true
          sleep 1
          kill "$LOGCAT_PID" 2>/dev/null || true
          sleep 1
          grep -E "ActivityTaskManager|ActivityManager|WindowManager|InputDispatcher|AndroidRuntime|${AUT_PACKAGE}" \
            "${GITHUB_WORKSPACE}/observer-logcat-raw.log" > "${GITHUB_WORKSPACE}/observer-logcat-filtered.log" 2>/dev/null || true
          echo "OBSERVER_STATE_SAMPLES=$(wc -l < "${GITHUB_WORKSPACE}/observer-state.log" 2>/dev/null || echo 0)"
          echo "OBSERVER_LOGCAT_RAW_LINES=$(wc -l < "${GITHUB_WORKSPACE}/observer-logcat-raw.log" 2>/dev/null || echo 0)"
          echo "OBSERVER_LOGCAT_FILTERED_LINES=$(wc -l < "${GITHUB_WORKSPACE}/observer-logcat-filtered.log" 2>/dev/null || echo 0)"

          kill "$APPIUM_PID" 2>/dev/null || true
          section "HOST OBSERVER SCRIPT COMPLETE"
          exit 0
          HOST_OBSERVER_EOF
          chmod +x "${{ github.workspace }}/host-observer.sh"

      - name: Boot Emulator and Run Host-Observed Test
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          AUT_PACKAGE: ${{ env.AUT_PACKAGE }}
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: ${{ env.ANDROID_TARGET }}
          arch: ${{ env.ANDROID_ARCH }}
          profile: ${{ env.ANDROID_DEVICE_PROFILE }}
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash ${{ github.workspace }}/host-observer.sh > ${{ github.workspace }}/host-observer-output.log 2>&1; cat ${{ github.workspace }}/host-observer-output.log

      - name: Upload Host-Observer Evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: phase-19-4h-host-observer-${{ github.run_number }}
          path: |
            ${{ github.workspace }}/host-observer-output.log
            ${{ github.workspace }}/observer-state.log
            ${{ github.workspace }}/observer-logcat-raw.log
            ${{ github.workspace }}/observer-logcat-filtered.log
            reports/
            logs/
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
