name: Phase 19.1C — GitHub Linux Docker/ADB Connectivity Spike (Throwaway)

# THROWAWAY CONNECTIVITY SPIKE — NOT part of the production pipeline.
# Manual trigger only. Does not build the project, does not run the test suite,
# does not touch mobile-automation.yml. Deleted after Phase 19.1C evidence is collected.
on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  ANDROID_API_LEVEL: "34"
  ANDROID_TARGET: "google_apis"
  ANDROID_ARCH: "x86_64"
  APPIUM_SERVER_VERSION: "3.6.0"
  APPIUM_UIAUTOMATOR2_DRIVER_VERSION: "8.2.2"

jobs:
  connectivity-spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Write spike script
        run: |
          cat > "${{ github.workspace }}/spike.sh" <<'SPIKE_EOF'
          #!/usr/bin/env bash
          set -u

          section () { echo ""; echo "===== $1 ====="; }

          section "RUNNER BASELINE"
          echo "uname: $(uname -a)"
          echo "arch: $(uname -m)"
          echo "--- docker version ---"
          docker version
          echo "--- docker context ---"
          docker context show
          echo "--- adb version (host) ---"
          adb version
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "--- node version ---"
          node --version 2>&1 || echo "node not found"
          echo "--- java version ---"
          java -version 2>&1 || echo "java not found"

          section "EMULATOR CHECK"
          adb devices -l
          BOOT=$(adb shell getprop sys.boot_completed | tr -d '\r')
          echo "boot_completed=$BOOT"
          echo "sdk=$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          echo "model=$(adb shell getprop ro.product.model | tr -d '\r')"

          section "ADB HOST BINDING STATE (BEFORE any change)"
          (ss -tlnp 2>/dev/null | grep 5037) || (sudo ss -tlnp 2>/dev/null | grep 5037) || echo "no listener info via ss"

          section "MODEL 1 -- CONTAINER -> HOST ADB -> EMULATOR (no rebind attempted first)"
          docker run --rm --network=host ubuntu:24.04 bash -c '
            set -u
            echo "[container] installing adb (apt android-tools-adb)"
            apt-get update -qq >/dev/null 2>&1
            apt-get install -y -qq android-tools-adb >/dev/null 2>&1
            if ! command -v adb >/dev/null 2>&1; then
              echo "[container] apt package unavailable, falling back to platform-tools zip"
              apt-get install -y -qq curl unzip >/dev/null 2>&1
              curl -sL -o /tmp/pt.zip https://dl.google.com/android/repository/platform-tools-latest-linux.zip
              unzip -q /tmp/pt.zip -d /opt
              export PATH="/opt/platform-tools:$PATH"
            fi
            echo "[container] adb version:"
            adb version
            echo "MODEL1_TCP_RESULT_START"
            timeout 5 bash -c "cat < /dev/null > /dev/tcp/127.0.0.1/5037" && echo "MODEL1_TCP_RESULT=CONNECTED" || echo "MODEL1_TCP_RESULT=FAILED"
            echo "MODEL1_DEVICES_START"
            adb devices -l
            echo "MODEL1_DEVICES_END"
            echo "MODEL1_GET_STATE_START"
            adb get-state
            echo "MODEL1_GET_STATE_END"
            echo "MODEL1_SDK_PROP=$(adb shell getprop ro.build.version.sdk | tr -d "\r")"
            echo "MODEL1_MODEL_PROP=$(adb shell getprop ro.product.model | tr -d "\r")"
          '
          echo "MODEL1_CONTAINER_EXIT_CODE=$?"

          section "MODEL 3 -- CONTAINER -> HOST APPIUM -> HOST ADB -> EMULATOR"
          echo "[host] installing Appium ${APPIUM_SERVER_VERSION} + UiAutomator2 driver ${APPIUM_UIAUTOMATOR2_DRIVER_VERSION}"
          npm install --global "appium@${APPIUM_SERVER_VERSION}" > /tmp/appium-install.log 2>&1
          appium driver install "uiautomator2@${APPIUM_UIAUTOMATOR2_DRIVER_VERSION}" > /tmp/appium-driver-install.log 2>&1

          nohup appium --address 0.0.0.0 --port 4723 > /tmp/appium-server.log 2>&1 &
          APPIUM_PID=$!
          echo "[host] Appium PID: $APPIUM_PID"

          READY=0
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:4723/status >/dev/null 2>&1; then READY=1; break; fi
            sleep 2
          done
          echo "[host] appium ready=$READY after wait loop"

          echo "[host] appium /status response:"
          curl -s http://127.0.0.1:4723/status || echo "[host] appium status curl FAILED"
          echo ""

          echo "[container] MODEL3_HTTP_START"
          docker run --rm --network=host ubuntu:24.04 bash -c '
            set -u
            apt-get update -qq >/dev/null 2>&1
            apt-get install -y -qq curl >/dev/null 2>&1
            echo "MODEL3_HTTP_STATUS_START"
            curl -s -w "\nHTTP_CODE=%{http_code}\n" http://127.0.0.1:4723/status
            echo "MODEL3_HTTP_STATUS_END"
          '
          echo "MODEL3_HTTP_CONTAINER_EXIT_CODE=$?"

          echo "[container] MODEL3_SESSION_START (capability-less, no app, no framework code involved)"
          docker run --rm --network=host ubuntu:24.04 bash -c '
            set -u
            apt-get update -qq >/dev/null 2>&1
            apt-get install -y -qq curl >/dev/null 2>&1
            echo "MODEL3_SESSION_POST_START"
            curl -s -X POST http://127.0.0.1:4723/session \
              -H "Content-Type: application/json" \
              -d "{\"capabilities\":{\"alwaysMatch\":{\"platformName\":\"Android\",\"appium:automationName\":\"UiAutomator2\",\"appium:deviceName\":\"emulator-5554\",\"appium:platformVersion\":\"14\",\"appium:noReset\":true},\"firstMatch\":[{}]}}" \
              -o /tmp/session-response.json -w "HTTP_CODE=%{http_code}\n"
            echo "MODEL3_SESSION_RESPONSE_BODY_START"
            cat /tmp/session-response.json
            echo ""
            echo "MODEL3_SESSION_RESPONSE_BODY_END"
            SESSION_ID=$(grep -oE "\"sessionId\":\"[a-zA-Z0-9-]+\"" /tmp/session-response.json | head -1 | cut -d"\"" -f4)
            echo "MODEL3_EXTRACTED_SESSION_ID=${SESSION_ID:-none}"
            if [ -n "${SESSION_ID:-}" ]; then
              echo "MODEL3_DELETE_SESSION_START"
              curl -s -X DELETE "http://127.0.0.1:4723/session/${SESSION_ID}" -w "\nDELETE_HTTP_CODE=%{http_code}\n"
              echo "MODEL3_DELETE_SESSION_END"
            fi
          '
          echo "MODEL3_SESSION_CONTAINER_EXIT_CODE=$?"

          section "CLEANUP (within this ephemeral runner)"
          kill "$APPIUM_PID" 2>/dev/null || true
          echo "appium stopped (pid $APPIUM_PID, best-effort)"

          section "SPIKE SCRIPT COMPLETE"
          SPIKE_EOF
          chmod +x "${{ github.workspace }}/spike.sh"

      - name: Boot emulator and run connectivity spike
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: ${{ env.ANDROID_TARGET }}
          arch: ${{ env.ANDROID_ARCH }}
          profile: pixel
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash ${{ github.workspace }}/spike.sh > ${{ github.workspace }}/spike-output.log 2>&1 || true; cat ${{ github.workspace }}/spike-output.log

      - name: Upload spike evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: phase-19-1c-evidence
          path: |
            ${{ github.workspace }}/spike-output.log
          retention-days: 14
