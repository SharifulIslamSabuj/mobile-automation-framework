name: Phase 19.4 — GitHub Actions Docker Execution Proof (Temporary)

# TEMPORARY, MANUAL-TRIGGER-ONLY proof workflow — NOT part of the production
# pipeline. Does not touch mobile-automation.yml. Mirrors that workflow's
# environment pins (Appium 3.6.0 / UiAutomator2 8.2.2 / API 34 google_apis
# x86_64 pixel / AUT 2.2.0) for parity, but runs the Gradle/TestNG harness
# INSIDE the Phase 19.3 Docker image instead of directly on the runner —
# proving the Model 3 architecture (docs/docker/PHASE_19.2_...md) on
# GitHub-hosted Linux. Deleted after Phase 19.4 evidence is collected.
on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  APPIUM_SERVER_VERSION: "3.6.0"
  APPIUM_UIAUTOMATOR2_DRIVER_VERSION: "8.2.2"
  AUT_RELEASE_TAG: "2.2.0"
  AUT_APK_ASSET: "mda-2.2.0-25.apk"
  AUT_DOWNLOAD_URL: "https://github.com/saucelabs/my-demo-app-android/releases/download/2.2.0/mda-2.2.0-25.apk"
  ANDROID_API_LEVEL: "34"
  ANDROID_PLATFORM_VERSION: "14"
  ANDROID_TARGET: "google_apis"
  ANDROID_ARCH: "x86_64"
  ANDROID_DEVICE_PROFILE: "pixel"
  EMULATOR_DEVICE_NAME: "emulator-5554"

jobs:
  docker-proof:
    name: Docker Harness Proof (Android Emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Host Appium — NOT installed inside Docker (Model 3 boundary).
      - name: Install Appium Server
        run: npm install --global "appium@${{ env.APPIUM_SERVER_VERSION }}"

      - name: Install UiAutomator2 Driver
        run: appium driver install "uiautomator2@${{ env.APPIUM_UIAUTOMATOR2_DRIVER_VERSION }}"

      - name: Restore Cached AUT APK
        id: apk-cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/${{ env.AUT_APK_ASSET }}
          key: aut-apk-${{ env.AUT_RELEASE_TAG }}

      - name: Download AUT APK
        if: steps.apk-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL -o "${{ runner.temp }}/${{ env.AUT_APK_ASSET }}" "${{ env.AUT_DOWNLOAD_URL }}"

      - name: Export APK Path
        run: echo "APK_PATH=${{ runner.temp }}/${{ env.AUT_APK_ASSET }}" >> "$GITHUB_ENV"

      # Docker image build happens on the runner HOST (Docker is preinstalled
      # on ubuntu-24.04 runners, verified Phase 19.1C) — BEFORE the emulator
      # boots, so a build failure is cheap to diagnose (Gate 4).
      - name: Gate 4 — Build Docker Harness Image
        run: |
          START=$(date +%s)
          docker build -t mobile-automation-harness:phase19.4 .
          END=$(date +%s)
          echo "GATE4_BUILD_DURATION_SECONDS=$((END-START))"
          docker images mobile-automation-harness:phase19.4 --format "GATE4_IMAGE_SIZE={{.Size}}"

      - name: Gate 5 — Container Starts, Java/Gradle Correct
        run: |
          docker run --rm mobile-automation-harness:phase19.4 whoami
          docker run --rm mobile-automation-harness:phase19.4 java -version
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace mobile-automation-harness:phase19.4 ./gradlew --version --no-daemon

      - name: Write Docker proof script
        run: |
          cat > "${{ github.workspace }}/docker-proof.sh" <<'PROOF_EOF'
          #!/usr/bin/env bash
          set -u

          section () { echo ""; echo "===== $1 ====="; }

          section "GATE 1-2: RUNNER + EMULATOR"
          adb devices -l
          echo "GATE1_GATE2_STATUS=PASS (runner ready, emulator online — action already waited for boot)"

          section "GATE 3: HOST APPIUM"
          appium server --log-level info --relaxed-security > "${RUNNER_TEMP}/appium-server.log" 2>&1 &
          APPIUM_PID=$!
          echo "Appium PID: $APPIUM_PID"
          READY=0
          for i in $(seq 1 30); do if curl -sf http://127.0.0.1:4723/status > /dev/null; then READY=1; break; fi; sleep 2; done
          if [ "$READY" != "1" ]; then echo "GATE3_STATUS=FAIL (Appium did not become reachable)"; exit 1; fi
          echo "GATE3_STATUS=PASS"
          curl -s http://127.0.0.1:4723/status

          section "GATE 6: CONTAINER -> HOST APPIUM (--network=host, Phase 19.1C model)"
          docker run --rm --network=host mobile-automation-harness:phase19.4 bash -c 'timeout 5 bash -c "cat < /dev/null > /dev/tcp/127.0.0.1/4723" && echo "GATE6_STATUS=PASS" || echo "GATE6_STATUS=FAIL"'

          section "GATE 7-8: CONTAINER-CREATED APPIUM SESSION VIA ONE REPRESENTATIVE TEST"
          docker run --rm --network=host \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            mobile-automation-harness:phase19.4 \
            ./gradlew test --tests "com.mobileautomation.framework.tests.LoginTest" --no-daemon \
              -Denv=emulator \
              -Dappium.serverUrl=http://127.0.0.1:4723 \
              -Dplatform.version="${ANDROID_PLATFORM_VERSION}" \
              -Ddevice.name="${EMULATOR_DEVICE_NAME}" \
              -Dapp.path="${APK_PATH}"
          REPRESENTATIVE_EXIT=$?
          if [ "$REPRESENTATIVE_EXIT" -ne 0 ]; then
            echo "GATE7_GATE8_STATUS=FAIL (representative test did not pass, exit=$REPRESENTATIVE_EXIT)"
            echo "STOPPING before full suite per Phase 19.4 progressive-validation rule."
            exit 1
          fi
          echo "GATE7_GATE8_STATUS=PASS"

          section "GATE 9-10: FULL 19-TEST SUITE"
          ./gradlew clean 2>&1 | tail -5
          docker run --rm --network=host \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            mobile-automation-harness:phase19.4 \
            ./gradlew test --no-daemon \
              -Denv=emulator \
              -Dappium.serverUrl=http://127.0.0.1:4723 \
              -Dplatform.version="${ANDROID_PLATFORM_VERSION}" \
              -Ddevice.name="${EMULATOR_DEVICE_NAME}" \
              -Dapp.path="${APK_PATH}"
          FULL_SUITE_EXIT=$?
          if [ "$FULL_SUITE_EXIT" -eq 0 ]; then
            echo "GATE9_GATE10_STATUS=PASS"
          else
            echo "GATE9_GATE10_STATUS=FAIL (exit=$FULL_SUITE_EXIT)"
          fi

          kill "$APPIUM_PID" 2>/dev/null || true
          section "DOCKER PROOF SCRIPT COMPLETE"
          exit "$FULL_SUITE_EXIT"
          PROOF_EOF
          chmod +x "${{ github.workspace }}/docker-proof.sh"

      - name: Boot Emulator and Run Docker Proof
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: ${{ env.ANDROID_TARGET }}
          arch: ${{ env.ANDROID_ARCH }}
          profile: ${{ env.ANDROID_DEVICE_PROFILE }}
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash ${{ github.workspace }}/docker-proof.sh

      - name: Verify Artifact Output
        if: always()
        run: |
          echo "reports/:"; ls -la reports 2>/dev/null || echo "  not present"
          echo "reports/screenshots/:"; ls -la reports/screenshots 2>/dev/null || echo "  not present"
          echo "logs/:"; ls -la logs 2>/dev/null || echo "  not present"
          echo "build/reports/tests/test/:"; ls -la build/reports/tests/test 2>/dev/null || echo "  not present"
          echo "build/test-results/test/:"; ls -la build/test-results/test 2>/dev/null || echo "  not present"

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: phase-19-4-docker-proof-${{ github.run_number }}
          path: |
            reports/
            logs/
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
